<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AdaptEduca — educação personalizada e acessível.">
<title>Nova senha | AdaptEduca</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('adapteduca_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
<link rel="stylesheet" href="./css/reset.css"><link rel="stylesheet" href="./css/variables.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css"><link rel="stylesheet" href="./css/app.css">
</head><body data-root="./" data-page="redefinir-senha">
<main class="auth-page"><section class="card auth-card"><div class="auth-icon">✉</div><h1>Criar nova senha</h1><p class="auth-sub">Escolha uma senha com pelo menos 8 caracteres.</p>
<form class="auth-form" id="resetForm"><div class="input-group"><label for="password">Nova senha</label><input class="input" id="password" name="password" type="password" minlength="8" required></div>
<div class="input-group"><label for="confirm">Confirmar senha</label><input class="input" id="confirm" name="confirm" type="password" minlength="8" required></div>
<button class="btn btn-primary btn-block" type="submit">Redefinir senha</button><p class="small muted" id="resetMsg" role="status"></p></form>
<p class="auth-footer"><a href="login.html" style="color:var(--primary);font-weight:700">← Voltar ao login</a></p></section><button class="theme-toggle" type="button" data-theme-toggle style="position:fixed;top:14px;right:14px">☾</button></main>
<script defer src="./js/data.js"></script><script defer src="./js/theme.js"></script><script defer src="./js/api.js"></script><script defer src="./js/auth.js"></script><script defer src="./js/navigation.js"></script><script defer src="./js/components.js"></script><script defer src="./js/ui.js"></script><script defer src="./js/script.js"></script><script defer src="./js/pages-auth.js"></script>
</body></html>
