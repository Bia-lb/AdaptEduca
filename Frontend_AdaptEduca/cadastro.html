
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="AdaptEduca — educação personalizada e acessível."
    >

    <title>Criar Conta | AdaptEduca</title>

    <!-- TEMA DO SISTEMA -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem("adapteduca_theme") ||
            (
                matchMedia("(prefers-color-scheme: dark)").matches
                    ? "dark"
                    : "light"
            );
    </script>

    <!-- ARQUIVOS CSS -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/app.css">

</head>

<body data-root="./" data-page="cadastro">

    <main class="auth-page">

        <section
            class="card auth-card"
            style="width: min(100%, 620px)"
        >

            <!-- CABEÇALHO -->
            <div class="auth-icon">♙+</div>

            <h1>Criar Conta</h1>

            <p class="auth-sub">
                Preencha os dados para começar
            </p>

            <!-- FORMULÁRIO DE CADASTRO -->
            <form class="auth-form" id="registerForm">

                <!-- SELEÇÃO DO PERFIL -->
                <div class="input-group">

                    <label>Tipo de Perfil</label>

                    <div class="role-selector">

                        <!-- ALUNO -->
                        <label class="role-option selected">
                            ♙

                            <input
                                type="radio"
                                name="role"
                                value="aluno"
                                checked
                            >

                            <strong>Aluno</strong>

                            <span>
                                Quero aprender do meu jeito
                            </span>
                        </label>

                        <!-- PROFESSOR -->
                        <label class="role-option">
                            ♧

                            <input
                                type="radio"
                                name="role"
                                value="professor"
                            >

                            <strong>Professor</strong>

                            <span>
                                Vou ensinar e acompanhar alunos
                            </span>
                        </label>

                        <!-- RESPONSÁVEL -->
                        <label class="role-option">
                            ♧

                            <input
                                type="radio"
                                name="role"
                                value="responsavel"
                            >

                            <strong>Responsável</strong>

                            <span>
                                Vou acompanhar meus filhos
                            </span>
                        </label>

                    </div>
                </div>

                <!-- NOME COMPLETO -->
                <div class="input-group">

                    <label for="name">
                        Nome Completo
                    </label>

                    <input
                        class="input"
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>

                <!-- E-MAIL -->
                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        class="input"
                        id="email"
                        name="email"
                        type="email"
                        placeholder="seu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

                


<!-- CAMPO EXCLUSIVO DO PROFESSOR -->
<div
    class="input-group"
    id="campoDisciplina"
    style="display: none;"
>
    <label for="disciplina">
        Disciplina que leciona
    </label>

    <input
        class="input"
        id="disciplina"
        name="disciplina"
        type="text"
        placeholder="Ex.: Matemática, Português, Biologia..."
        maxlength="80"
    >
</div>



                <!-- SENHA E CONFIRMAÇÃO -->
                <div class="form-row">

                    <!-- SENHA -->
                    <div class="input-group">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            class="input"
                            id="password"
                            name="password"
                            type="password"
                            minlength="8"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                    <!-- CONFIRMAR SENHA -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirmar Senha
                        </label>

                        <input
                            class="input"
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            minlength="8"
                            placeholder="••••••••"
                            autocomplete="new-password"
                            required
                        >

                    </div>

                </div>

                <!-- TERMOS DE USO -->
                <label class="small muted">

                    <input
                        type="checkbox"
                        name="terms"
                        value="accepted"
                    >

                    Concordo com os

                    <a href="#" style="color: var(--primary)">
                        Termos de Uso
                    </a>

                    e

                    <a href="#" style="color: var(--primary)">
                        Política de Privacidade
                    </a>

                </label>

                <!-- BOTÃO CRIAR CONTA -->
                <button
                    class="btn btn-primary btn-block"
                    type="submit"
                >
                    Criar Conta
                </button>

                <!-- SEPARADOR -->
                <div
                    style="
                        text-align: center;
                        color: var(--text-2);
                        font-size: .75rem;
                    "
                >
                    ou
                </div>

                <!-- PERFIL DE APRENDIZAGEM -->
                <button
                    class="btn btn-outline btn-block"
                    type="button"
                    data-modal-title="Perfil de Aprendizagem"
                    data-modal-message="Crie sua conta como aluno para preencher o perfil de aprendizagem."
                >
                    📋 Preencher Perfil de Aprendizagem
                </button>

            </form>

            <!-- LINK PARA LOGIN -->
            <p class="auth-footer">

                Já tem uma conta?

                <a
                    href="login.html"
                    style="
                        color: var(--primary);
                        font-weight: 700;
                    "
                >
                    Faça login
                </a>

            </p>

        </section>

        <!-- BOTÃO PARA ALTERAR TEMA -->
        <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            style="
                position: fixed;
                top: 14px;
                right: 14px;
            "
            aria-label="Alternar tema"
        >
            ☾
        </button>

    </main>

    <!-- SCRIPTS DO SISTEMA -->
    <script defer src="./js/data.js"></script>
    <script defer src="./js/theme.js"></script>
    <script defer src="./js/api.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/navigation.js"></script>
    <script defer src="./js/components.js"></script>
    <script defer src="./js/ui.js"></script>
    <script defer src="./js/script.js"></script>
    <script defer src="./js/pages-auth.js"></script>

   


<!-- CONTROLE DO CAMPO DE DISCIPLINA -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const campoDisciplina =
        document.getElementById("campoDisciplina");

    const inputDisciplina =
        document.getElementById("disciplina");

    const opcoes =
        document.querySelectorAll(".role-option");

    function atualizarCampoDisciplina() {

        const perfilSelecionado =
            document.querySelector(
                'input[name="role"]:checked'
            );

        const ehProfessor =
            perfilSelecionado?.value === "professor";

        // Mostrar somente para professor
        campoDisciplina.hidden = !ehProfessor;

        campoDisciplina.style.display =
            ehProfessor ? "block" : "none";

        // Limpar disciplina dos outros perfis
        if (!ehProfessor) {
            inputDisciplina.value = "";
        }
    }

    // O navigation.js altera o perfil pelo clique.
    // Por isso, precisamos escutar o clique também.
    opcoes.forEach(function (opcao) {

        opcao.addEventListener("click", function () {

            const radio = opcao.querySelector(
                'input[name="role"]'
            );

            if (radio) {
                radio.checked = true;
            }

            atualizarCampoDisciplina();
        });

    });

    // Também atende mudanças pelo teclado
    document.querySelectorAll(
        'input[name="role"]'
    ).forEach(function (radio) {

        radio.addEventListener(
            "change",
            atualizarCampoDisciplina
        );

    });

    // Estado inicial
    atualizarCampoDisciplina();

});
</script>




</body>
</html>
