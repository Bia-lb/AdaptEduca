
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AdaptEduca — educação personalizada e acessível.">

    <title>Criar Conta | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/app.css">
</head>

<body data-root="./" data-page="cadastro">

    <!-- Conteúdo principal -->
    <main class="auth-page">

        <!-- Card de cadastro -->
        <section
            class="card auth-card"
            style="width:min(100%,620px)"
        >

            <div class="auth-icon">♙+</div>

            <h1>Criar Conta</h1>

            <p class="auth-sub">
                Preencha os dados para começar
            </p>

            <!-- Formulário de cadastro -->
            <form class="auth-form" id="registerForm">

                <!-- Seleção do tipo de perfil -->
                <div class="input-group">

                    <label>Tipo de Perfil</label>

                    <div class="role-selector">

                        <!-- Perfil Aluno -->
                        <label class="role-option selected">
                            ♙

                            <input
                                type="radio"
                                name="role"
                                value="aluno"
                                checked
                            >

                            <strong>Aluno</strong>

                            <span>
                                Quero aprender do meu jeito
                            </span>
                        </label>

                        <!-- Perfil Professor -->
                        <label class="role-option">
                            ♧

                            <input
                                type="radio"
                                name="role"
                                value="professor"
                            >

                            <strong>Professor</strong>

                            <span>
                                Vou ensinar e acompanhar alunos
                            </span>
                        </label>

                        <!-- Perfil Responsável -->
                        <label class="role-option">
                            ♧

                            <input
                                type="radio"
                                name="role"
                                value="responsavel"
                            >

                            <strong>Responsável</strong>

                            <span>
                                Vou acompanhar meus filhos
                            </span>
                        </label>

                    </div>
                </div>

                <!-- Nome completo -->
                <div class="input-group">

                    <label for="name">
                        Nome Completo
                    </label>

                    <input
                        class="input"
                        id="name"
                        name="name"
                        placeholder="Seu nome completo"
                        required
                    >
                </div>

                <!-- E-mail -->
                <div class="input-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        class="input"
                        id="email"
                        name="email"
                        type="email"
                        placeholder="seu@email.com"
                        required
                    >
                </div>

                <!-- Disciplina do professor -->
                <div class="input-group">

                    <label for="disciplina">
                        Disciplina que leciona

                        <span class="muted small">
                            (somente professores, opcional)
                        </span>
                    </label>

                    <input
                        class="input"
                        id="disciplina"
                        name="disciplina"
                        placeholder="Ex.: Biologia"
                        maxlength="80"
                    >
                </div>

                <!-- Campos de senha -->
                <div class="form-row">

                    <!-- Senha -->
                    <div class="input-group">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            class="input"
                            id="password"
                            name="password"
                            type="password"
                            minlength="8"
                            placeholder="••••••••"
                            required
                        >
                    </div>

                    <!-- Confirmar senha -->
                    <div class="input-group">

                        <label for="confirmPassword">
                            Confirmar Senha
                        </label>

                        <input
                            class="input"
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            minlength="8"
                            placeholder="••••••••"
                            required
                        >
                    </div>

                </div>

                <!-- Termos de uso e privacidade -->
                <label class="small muted">

                    <input
                        type="checkbox"
                        name="terms"
                        value="accepted"
                    >

                    Concordo com os

                    <a
                        href="#"
                        style="color:var(--primary)"
                    >
                        Termos de Uso
                    </a>

                    e

                    <a
                        href="#"
                        style="color:var(--primary)"
                    >
                        Política de Privacidade
                    </a>

                </label>

                <!-- Botão de cadastro -->
                <button
                    class="btn btn-primary btn-block"
                    type="submit"
                >
                    Criar Conta
                </button>

                <!-- Separador -->
                <div
                    style="text-align:center;color:var(--text-2);font-size:.75rem"
                >
                    ou
                </div>

                <!-- Perfil de aprendizagem -->
                <button
                    class="btn btn-outline btn-block"
                    type="button"
                    data-modal-title="Perfil de Aprendizagem"
                    data-modal-message="Crie sua conta como aluno para preencher o perfil de aprendizagem."
                >
                    📋 Preencher Perfil de Aprendizagem
                </button>

            </form>

            <!-- Link para login -->
            <p class="auth-footer">

                Já tem uma conta?

                <a
                    href="login.html"
                    style="color:var(--primary);font-weight:700"
                >
                    Faça login
                </a>

            </p>

        </section>

        <!-- Botão de alternância do tema -->
        <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            style="position:fixed;top:14px;right:14px"
        >
            ☾
        </button>

    </main>

    <!-- Arquivos JavaScript -->
    <script defer src="./js/data.js"></script>
    <script defer src="./js/theme.js"></script>
    <script defer src="./js/api.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/navigation.js"></script>
    <script defer src="./js/components.js"></script>
    <script defer src="./js/ui.js"></script>
    <script defer src="./js/script.js"></script>
    <script defer src="./js/pages-auth.js"></script>

</body>

</html>
