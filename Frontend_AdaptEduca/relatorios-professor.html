
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="Relatórios do Professor — AdaptEduca"
    >

    <title>Relatórios do Professor | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body
    data-root="./"
    data-page="relatorios-professor"
    data-private="true"
    data-role="professor"
>

    <!-- Cabeçalho -->
    <div id="site-header"></div>

    <!-- Conteúdo principal -->
    <main>

        <!-- Apresentação da página -->
        <section class="page-hero">
            <div class="container">

                <h1>Relatórios</h1>

                <p>
                    Analise evolução, engajamento e
                    desempenho das turmas.
                </p>

            </div>
        </section>

        <!-- Área de relatórios do professor -->
        <div
            class="container app-page"
            id="app"
            data-loading="1"
        >
            <p class="muted">Carregando…</p>
        </div>

    </main>

    <!-- Arquivos JavaScript -->
    <script defer src="js/data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/pages-professor.js"></script>

</body>

</html>
