
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="Configurações do Professor — AdaptEduca"
    >

    <title>Configurações do Professor | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body
    data-root="./"
    data-page="configuracoes-professor"
    data-private="true"
    data-role="professor"
>
    <!-- Cabeçalho -->
    <div id="site-header"></div>

    <!-- Conteúdo principal -->
    <main>

        <!-- Apresentação da página -->
        <section class="page-hero">
            <div class="container">
                <h1>Configurações</h1>
                <p>Gerencie perfil, notificações e preferências.</p>
            </div>
        </section>

        <!-- Área de configurações -->
        <div class="container app-page">

            <div class="settings-grid">

                <!-- Menu lateral -->
                <aside class="card settings-nav">
                    <button class="active">Perfil</button>
                    <button>Notificações</button>
                    <button>Privacidade</button>
                    <button>Aparência</button>
                </aside>

                <!-- Formulário de configurações -->
                <form
                    class="card form-card"
                    data-demo-form
                    data-success="Configurações atualizadas!"
                >
                    <h2>Perfil do professor</h2>

                    <!-- Dados do professor -->
                    <div
                        class="form-row"
                        style="margin-top:18px"
                    >

                        <!-- Nome -->
                        <div class="input-group">
                            <label>Nome</label>

                            <input
                                class="input"
                                value="Carlos Santos"
                            >
                        </div>

                        <!-- E-mail -->
                        <div class="input-group">
                            <label>E-mail</label>

                            <input
                                class="input"
                                type="email"
                                value="professor@adapteduca.com"
                            >
                        </div>

                        <!-- Disciplina principal -->
                        <div class="input-group">
                            <label>Disciplina principal</label>

                            <input
                                class="input"
                                value="Matemática"
                            >
                        </div>

                        <!-- Registro -->
                        <div class="input-group">
                            <label>Registro</label>

                            <input
                                class="input"
                                value="PROF-2026-014"
                            >
                        </div>

                    </div>

                    <!-- Preferências de notificações -->
                    <h3 style="margin:24px 0 12px">
                        Notificações
                    </h3>

                    <!-- Alertas de desempenho -->
                    <label class="choice checkbox">
                        <input
                            type="checkbox"
                            checked
                        >

                        <span>
                            Alertas sobre alunos com baixo desempenho
                        </span>
                    </label>

                    <!-- Resumo semanal -->
                    <label
                        class="choice checkbox"
                        style="margin-top:8px"
                    >
                        <input
                            type="checkbox"
                            checked
                        >

                        <span>
                            Resumo semanal das turmas
                        </span>
                    </label>

                    <!-- Salvar configurações -->
                    <button
                        class="btn btn-primary"
                        style="margin-top:20px"
                    >
                        Salvar configurações
                    </button>

                </form>

            </div>

        </div>

    </main>

    <!-- Arquivos JavaScript -->
    <script defer src="js/data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/script.js"></script>

</body>

</html>
