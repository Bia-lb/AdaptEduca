
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Atividades do Aluno — AdaptEduca">

    <title>Atividades do Aluno | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body
    data-root="./"
    data-page="atividades-aluno"
    data-private="true"
    data-role="aluno"
>
    <!-- Cabeçalho -->
    <div id="site-header"></div>

    <!-- Conteúdo principal -->
    <main>

        <!-- Apresentação da página -->
        <section class="page-hero">
            <div class="container">
                <h1>Atividades</h1>
                <p>Organize prazos, exercícios e avaliações.</p>
            </div>
        </section>

        <!-- Área de atividades do aluno -->
        <div class="container app-page">

            <!-- Abas de filtro -->
            <div class="tabs">
                <button
                    class="tab-btn active"
                    data-atividade-filtro="Pendente"
                >
                    Pendentes
                </button>

                <button
                    class="tab-btn"
                    data-atividade-filtro="Concluida"
                >
                    Concluídas
                </button>

                <button
                    class="tab-btn"
                    data-atividade-filtro="Todas"
                >
                    Todas
                </button>
            </div>

            <!-- Lista de atividades -->
            <section
                class="grid"
                style="margin-top:20px"
                id="studentActivities"
            ></section>

        </div>

    </main>

    <!-- Arquivos JavaScript -->
    <script defer src="js/data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/pages-aluno.js"></script>

</body>

</html>
