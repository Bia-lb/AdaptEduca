
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="Turmas — AdaptEduca"
    >

    <title>Turmas | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body
    data-root="./"
    data-page="turmas"
    data-private="true"
    data-role="professor"
>

    <!-- Cabeçalho -->
    <div id="site-header"></div>

    <!-- Conteúdo principal -->
    <main>

        <!-- Apresentação da página -->
        <section class="page-hero">
            <div class="container">

                <h1>Turmas</h1>

                <p>
                    Gerencie suas turmas, horários e alunos.
                </p>

            </div>
        </section>

        <!-- Área de gerenciamento de turmas -->
        <div class="container app-page">

            <!-- Cabeçalho da listagem -->
            <div class="page-title-row">

                <div>
                    <h2>Minhas turmas</h2>

                    <p
                        class="muted small"
                        id="turmasResumo"
                    >
                        Carregando…
                    </p>
                </div>

                <!-- Botão para criar nova turma -->
                <button
                    class="btn btn-primary"
                    id="newTurmaBtn"
                    type="button"
                >
                    + Nova Turma
                </button>

            </div>

            <!-- Listagem dinâmica das turmas -->
            <section class="class-overview"></section>

        </div>

    </main>

    <!-- Arquivos JavaScript -->
    <script defer src="js/data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/ui.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/pages-professor.js"></script>

</body>

</html>
