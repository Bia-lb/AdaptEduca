
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="AdaptEduca — educação personalizada e acessível."
    >

    <title>Entrar | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <link rel="stylesheet" href="./css/app.css">
</head>

<body data-root="./" data-page="login">

    <!-- Conteúdo principal -->
    <main class="auth-page">

        <!-- Card de login -->
        <section class="card auth-card">

            <!-- Ícone -->
            <div class="auth-icon">→</div>

            <!-- Título e descrição -->
            <h1>Bem-vindo de volta!</h1>

            <p class="auth-sub">
                Entre na sua conta para continuar
            </p>

            <!-- Formulário de login -->
            <form class="auth-form" id="loginForm">

                <!-- Campo de e-mail -->
                <div class="input-group">

                    <label for="loginEmail">
                        E-mail
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">✉</span>

                        <input
                            class="input has-icon"
                            id="loginEmail"
                            name="email"
                            type="email"
                            placeholder="seu@email.com"
                            required
                        >

                    </div>
                </div>

                <!-- Campo de senha -->
                <div class="input-group">

                    <label for="loginPassword">
                        Senha
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">♙</span>

                        <input
                            class="input has-icon"
                            id="loginPassword"
                            name="password"
                            type="password"
                            placeholder="••••••••"
                            required
                        >

                        <!-- Mostrar ou ocultar senha -->
                        <button
                            type="button"
                            data-password-toggle="#loginPassword"
                            style="position:absolute;right:10px;top:9px;border:0;background:transparent;color:var(--text-2)"
                        >
                            ◉
                        </button>

                    </div>
                </div>

                <!-- Opções de login -->
                <div class="auth-links">

                    <!-- Lembrar usuário -->
                    <label>
                        <input
                            type="checkbox"
                            name="remember"
                        >
                        Lembrar de mim
                    </label>

                    <!-- Recuperação de senha -->
                    <a
                        href="esqueci-senha.html"
                        style="color:var(--primary)"
                    >
                        Esqueceu a senha?
                    </a>

                </div>

                <!-- Botão de login -->
                <button
                    class="btn btn-primary btn-block"
                    type="submit"
                >
                    Entrar
                </button>

            </form>

            <!-- Link para cadastro -->
            <p class="auth-footer">

                Não tem uma conta?

                <a
                    href="cadastro.html"
                    style="color:var(--primary);font-weight:700"
                >
                    Cadastre-se
                </a>

            </p>

            <!-- ========================================
                 ACESSO RÁPIDO DE DEMONSTRAÇÃO
            ========================================= -->

            <div class="demo-credentials">

                <strong>
                    Acesso rápido de demonstração
                </strong>

                <!-- Seleção de perfil para demonstração -->
                <div
                    style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"
                >

                    <!-- Aluno -->
                    <button
                        class="btn btn-soft"
                        data-demo-login="aluno"
                    >
                        Aluno
                    </button>

                    <!-- Professor -->
                    <button
                        class="btn btn-soft"
                        data-demo-login="professor"
                    >
                        Professor
                    </button>

                    <!-- Responsável -->
                    <button
                        class="btn btn-soft"
                        data-demo-login="responsavel"
                    >
                        Responsável
                    </button>

                </div>

                <!-- Informações de acesso -->
                <p style="margin-top:8px">
                    Use os dados de demonstração configurados
                    no banco (senha: senha123).
                </p>

            </div>

        </section>

        <!-- Botão de alternância do tema -->
        <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            style="position:fixed;top:14px;right:14px"
        >
            ☾
        </button>

    </main>

    <!-- Arquivos JavaScript -->
    <script defer src="./js/data.js"></script>
    <script defer src="./js/theme.js"></script>
    <script defer src="./js/api.js"></script>
    <script defer src="./js/auth.js"></script>
    <script defer src="./js/navigation.js"></script>
    <script defer src="./js/components.js"></script>
    <script defer src="./js/ui.js"></script>
    <script defer src="./js/script.js"></script>
    <script defer src="./js/pages-auth.js"></script>

</body>

</html>
