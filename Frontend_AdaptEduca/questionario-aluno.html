
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
        name="description"
        content="AdaptEduca — educação personalizada e acessível."
    >

    <title>Perfil de Aprendizagem | AdaptEduca</title>

    <!-- Configuração automática do tema -->
    <script>
        document.documentElement.dataset.theme =
            localStorage.getItem('adapteduca_theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light');
    </script>

    <!-- Arquivos CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body
    data-root="./"
    data-page="questionario-aluno"
    data-private="true"
    data-role="aluno"
>

    <!-- Conteúdo principal -->
    <main class="questionnaire-page">

        <div class="container">

            <!-- ========================================
                 CABEÇALHO DO QUESTIONÁRIO
            ========================================= -->

            <header class="questionnaire-head">

                <span class="eyebrow">
                    ♧ Perfil de Aprendizagem
                </span>

                <h1>Como você aprende?</h1>

                <p class="muted">
                    Responda para que possamos adaptar
                    os conteúdos ao seu estilo.
                </p>

            </header>

            <!-- ========================================
                 PROGRESSO DO QUESTIONÁRIO
            ========================================= -->

            <div class="questionnaire-progress">

                <!-- Indicadores de progresso -->
                <div class="progress-labels">

                    <span id="stepLabel">
                        Seção 1 de 9
                    </span>

                    <span id="stepPercent">
                        11% concluído
                    </span>

                </div>

                <!-- Barra de progresso -->
                <div class="progress">

                    <span
                        id="stepBar"
                        style="width:11%"
                    ></span>

                </div>

            </div>

            <!-- ========================================
                 FORMULÁRIO DO QUESTIONÁRIO
            ========================================= -->

            <form
                class="card question-card"
                id="questionnaireForm"
                novalidate
            >

                <!-- Etapas carregadas pelo JavaScript -->
                <div id="questionnaireStep"></div>

            </form>

            <!-- ========================================
                 INFORMAÇÕES SOBRE AS RESPOSTAS
            ========================================= -->

            <p class="questionnaire-note">
                Suas respostas ficam salvas e podem ser editadas
                no seu perfil a qualquer momento.
            </p>

        </div>

    </main>

    <!-- ========================================
         ARQUIVOS JAVASCRIPT
    ========================================= -->

    <script defer src="js/data.js"></script>
    <script defer src="js/theme.js"></script>
    <script defer src="js/api.js"></script>
    <script defer src="js/auth.js"></script>
    <script defer src="js/navigation.js"></script>
    <script defer src="js/components.js"></script>
    <script defer src="js/script.js"></script>
    <script defer src="js/questionnaire.js"></script>

</body>

</html>
