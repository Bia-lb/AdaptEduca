<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AdaptEduca — educação personalizada e acessível.">
<title>Criar Conta | AdaptEduca</title>
<script>document.documentElement.dataset.theme=localStorage.getItem('adapteduca_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
<link rel="stylesheet" href="./css/reset.css"><link rel="stylesheet" href="./css/variables.css"><link rel="stylesheet" href="./css/components.css"><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/responsive.css">
</head><body data-root="./" data-page="cadastro">
<main class="auth-page"><section class="card auth-card" style="width:min(100%,620px)"><div class="auth-icon">♙+</div><h1>Criar Conta</h1><p class="auth-sub">Preencha os dados para começar</p><form class="auth-form" id="registerForm"><div class="input-group"><label>Tipo de Perfil</label><div class="role-selector"><label class="role-option selected">♙<input type="radio" name="role" value="aluno" checked><strong>Aluno</strong><span>Quero aprender do meu jeito</span></label><label class="role-option">♧<input type="radio" name="role" value="professor"><strong>Professor</strong><span>Vou ensinar e acompanhar alunos</span></label><label class="role-option">♧<input type="radio" name="role" value="responsavel"><strong>Responsável</strong><span>Vou acompanhar meus filhos</span></label></div></div><div class="input-group"><label for="name">Nome Completo</label><input class="input" id="name" name="name" placeholder="Seu nome completo" required></div><div class="input-group"><label for="email">E-mail</label><input class="input" id="email" name="email" type="email" placeholder="seu@email.com" required></div><div class="form-row"><div class="input-group"><label for="password">Senha</label><input class="input" id="password" name="password" type="password" minlength="6" placeholder="••••••••" required></div><div class="input-group"><label for="confirmPassword">Confirmar Senha</label><input class="input" id="confirmPassword" name="confirmPassword" type="password" minlength="6" placeholder="••••••••" required></div></div><label class="small muted"><input type="checkbox" name="terms" value="accepted"> Concordo com os <a href="#" style="color:var(--primary)">Termos de Uso</a> e <a href="#" style="color:var(--primary)">Política de Privacidade</a></label><button class="btn btn-primary btn-block" type="submit">Criar Conta</button><div style="text-align:center;color:var(--text-2);font-size:.75rem">ou</div><button class="btn btn-outline btn-block" type="button" data-modal-title="Perfil de Aprendizagem" data-modal-message="Crie sua conta como aluno para preencher o perfil de aprendizagem.">📋 Preencher Perfil de Aprendizagem</button></form><p class="auth-footer">Já tem uma conta? <a href="login.html" style="color:var(--primary);font-weight:700">Faça login</a></p></section><button class="theme-toggle" type="button" data-theme-toggle style="position:fixed;top:14px;right:14px">☾</button></main>
<script defer src="./js/data.js"></script><script defer src="./js/theme.js"></script><script defer src="./js/api.js"></script><script defer src="./js/auth.js"></script><script defer src="./js/navigation.js"></script><script defer src="./js/components.js"></script><script defer src="./js/script.js"></script>
</body></html>
